stages:
  - sca
  - sast
  - iac
  - test
  - build
  - deploy
  - dast
  - vulnerability-management

default:
  artifacts:
    when: always
    expire_in: 1 week

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

sca:
  stage: sca
  image: python:3.11.11-slim
  before_script:
    - pip install --no-cache-dir --upgrade pip
    - pip install --no-cache-dir pip-audit==2.9.0
  script:
    - sh scripts/run_sca.sh
  artifacts:
    paths:
      - reports/sca/

sast:
  stage: sast
  image: semgrep/semgrep:1.123.0
  script:
    - sh scripts/run_sast.sh
  artifacts:
    paths:
      - reports/sast/

iac:
  stage: iac
  image:
    name: aquasec/trivy:0.65.0
    entrypoint: [""]
  script:
    - sh scripts/run_iac.sh
  artifacts:
    paths:
      - reports/iac/

test:
  stage: test
  image: python:3.11.11-slim
  before_script:
    - pip install --no-cache-dir --upgrade pip
    - pip install --no-cache-dir -r requirements-dev.txt
  script:
    - sh scripts/run_tests.sh
  artifacts:
    paths:
      - reports/tests/

build:
  stage: build
  image: docker:27.5.1
  services:
    - docker:27.5.1-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - sh scripts/run_build.sh
  artifacts:
    paths:
      - reports/build/

deploy:
  stage: deploy
  image: docker:27.5.1
  services:
    - docker:27.5.1-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  needs:
    - job: build
      artifacts: true
  script:
    - sh scripts/run_deploy.sh
  artifacts:
    paths:
      - reports/deploy/

dast:
  stage: dast
  image: docker:27.5.1
  services:
    - docker:27.5.1-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  needs:
    - job: build
      artifacts: true
  script:
    - sh scripts/run_dast.sh
  artifacts:
    paths:
      - reports/dast/

vulnerability-management:
  stage: vulnerability-management
  image: curlimages/curl:8.11.1
  needs:
    - job: sca
      artifacts: true
    - job: sast
      artifacts: true
    - job: iac
      artifacts: true
    - job: dast
      artifacts: true
  script:
    - sh scripts/run_defectdojo.sh
  artifacts:
    paths:
      - reports/vulnerability-management/
