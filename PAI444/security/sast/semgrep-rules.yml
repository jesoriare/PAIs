rules:
  - id: flask-legacy-markup-user-input
    message: User-controlled content wrapped with Markup disables escaping and can reintroduce XSS.
    severity: ERROR
    languages:
      - python
    metadata:
      category: security
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation"
      technology:
        - flask
    patterns:
      - pattern: Markup($VALUE)
